plugins {
    id 'com.android.application'
}

android {
    namespace 'cz.dashcam.auto'
    compileSdk 34

    defaultConfig {
        applicationId "cz.dashcam.auto"
        minSdk 23
        targetSdk 24
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
